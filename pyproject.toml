[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-adaptive-tutor-env"
version = "0.1.0"
description = "Adaptive DSA Tutor Environment for OpenEnv — RL-optimized personalized explanations"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
server = "adaptive_tutor_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["adaptive_tutor_env", "adaptive_tutor_env.server"]
package-dir = { "adaptive_tutor_env" = ".", "adaptive_tutor_env.server" = "server" }
